[project]
name = "lu-recycle-reco"
version = "0.1.0"
description = "Module B: image recognition and model access for the LU Recycle Assistant"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "Pillow>=10.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
reco = "reco.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
